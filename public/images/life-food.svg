<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Food table placeholder</title>
  <desc id="desc">Warm abstract photo placeholder inspired by food and shared tables.</desc>
  <defs>
    <linearGradient id="plate" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8e3c7"/>
      <stop offset=".48" stop-color="#d56c45"/>
      <stop offset="1" stop-color="#6b1719"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="620" fill="#f5dfce"/>
  <circle cx="260" cy="305" r="210" fill="#fff7ec"/>
  <circle cx="260" cy="305" r="142" fill="url(#plate)"/>
  <circle cx="646" cy="176" r="114" fill="#fff2d8"/>
  <circle cx="646" cy="176" r="76" fill="#af2931"/>
  <rect x="545" y="356" width="280" height="98" rx="49" fill="#f9c784" transform="rotate(-9 685 405)"/>
  <path d="M54 519 C247 428 360 480 520 394 C657 321 711 208 900 154" fill="none" stroke="#2d1713" stroke-width="42" stroke-opacity=".28"/>
  <rect width="900" height="620" filter="url(#grain)"/>
</svg>
