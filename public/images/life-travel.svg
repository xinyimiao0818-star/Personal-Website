<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Travel light placeholder</title>
  <desc id="desc">Warm abstract photo placeholder inspired by travel and streets.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0d8"/>
      <stop offset=".5" stop-color="#d75a45"/>
      <stop offset="1" stop-color="#1d1716"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="4"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="620" fill="url(#sky)"/>
  <rect x="92" y="94" width="260" height="430" fill="#f7eadc" opacity=".24"/>
  <rect x="394" y="156" width="148" height="368" fill="#5a2120" opacity=".32"/>
  <rect x="590" y="58" width="190" height="466" fill="#fff7eb" opacity=".18"/>
  <path d="M0 520 C190 420 268 450 406 374 C544 299 644 180 900 126" fill="none" stroke="#fff4df" stroke-width="70" stroke-opacity=".22"/>
  <path d="M114 580 L817 118" stroke="#441515" stroke-width="10" stroke-opacity=".3"/>
  <rect width="900" height="620" filter="url(#grain)"/>
</svg>
