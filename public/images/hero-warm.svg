<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1120" role="img" aria-labelledby="title desc">
  <title id="title">Warm editorial portrait placeholder</title>
  <desc id="desc">A warm-toned abstract lifestyle photograph placeholder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4d5bf"/>
      <stop offset="0.42" stop-color="#c94d3b"/>
      <stop offset="1" stop-color="#251310"/>
    </linearGradient>
    <radialGradient id="sun" cx="26%" cy="22%" r="54%">
      <stop offset="0" stop-color="#fff4db" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#fff4db" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff4db" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="900" height="1120" fill="url(#bg)"/>
  <rect width="900" height="1120" fill="url(#sun)"/>
  <path d="M-90 940 C170 700 244 780 421 571 C553 415 620 263 1000 101" fill="none" stroke="#fff6ea" stroke-width="220" stroke-opacity=".18"/>
  <path d="M58 1040 C330 840 430 855 565 675 C660 548 703 356 910 238" fill="none" stroke="#2a1512" stroke-width="150" stroke-opacity=".28"/>
  <rect x="0" y="0" width="900" height="1120" filter="url(#grain)" opacity=".55"/>
</svg>
